version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ent_grant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../apps/api:/app
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file: [../.env.example]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ../apps/web:/app
    command: sh -c "npm install && npm run dev"
    env_file: [../.env.example]
    ports: ["3000:3000"]

  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../apps/bot:/app
    command: sh -c "pip install -e . && uvicorn app.webhook:app --host 0.0.0.0 --port 8080"
    env_file: [../.env.example]
    ports: ["8080:8080"]

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../apps/worker:/app
    command: sh -c "pip install -e . && python app/worker.py"
    depends_on: [redis]

volumes:
  pgdata:
