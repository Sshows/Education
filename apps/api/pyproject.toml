[project]
name = "ent-grant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  "python-telegram-bot>=21.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "redis>=5.0",
  "numpy>=2.0",
  "python-jose>=3.3",
  "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
