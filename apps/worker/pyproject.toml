[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ent-grant-worker"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "python-dotenv>=1.0"
]
